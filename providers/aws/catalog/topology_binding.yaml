  personalize: resident.ai
  forecast: resident.ai
  kendra: resident.ai
  lex: resident.ai
  lexv2-models: resident.ai
  q: resident.ai

  # ── databases that are network residents when they have subnets ──
  rds: resident.data
  docdb: resident.data
  neptune: resident.data
  memorydb: resident.data
  elasticache: resident.data
  timestream-influxdb: resident.data

  # ── rule.platform: encryption, secrets, identity, delivery ──
  kms: rule.platform
  cloudhsm: rule.platform
  secretsmanager: rule.platform
  acm: rule.platform
  acm-pca: rule.platform
  iam: rule.identity          # account-scoped, so the account rail - not the region's
  sts: rule.identity
  cognito-idp: rule.platform
  cognito-identity: rule.platform
  signer: rule.platform
  codebuild: rule.platform
  codepipeline: rule.platform
  codedeploy: rule.governance
