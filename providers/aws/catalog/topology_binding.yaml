# AWS binding for the universal topology model.
#
# The model in providers/common/topology/model.yaml defines WHERE things draw,
# in terms of roles. This file says which AWS types play which role, and nothing
# else. No ranks, no anchors, no layout logic - those belong to the model, and
# duplicating them here is how two clouds drift apart.
#
# Resolution order, first match wins:
#
#     1. discriminators   the resource's own data decides (a gateway endpoint
#                         and an interface endpoint are the same TYPE and
#                         different PLACES)
#     2. overrides        this exact resource_key
#     2b. suffixes        what the type NAME says it is
#     3. services         the service segment of the key
#     4. unplaced         visible, named, and loud - never a silent default
#
# That order matters. Discriminators first, because data beats a lookup table:
# two Lambdas in the same account legitimately land in different boxes depending
# on whether their own payload carried a VpcConfig.

version: 1
model: providers/common/topology/model.yaml


# ══════════════════════════════════════════════════════════════════════
# SPINE — which AWS types are the containers
# ══════════════════════════════════════════════════════════════════════
#
# `scope` is stated per provider because it genuinely differs: an AWS VPC is
# regional, a GCP VPC is global. The model carries the difference rather than
# assuming AWS's answer is universal.

# Each role lists the COLLECTED type slug and any SYNTHETIC one the tree mints
# for the same role. LayerTree invents `vpc:` and `az:` nodes when a subnet
# names a container that was never collected, and those play the identical role
# - listing only the collected slug would leave half the spine unrecognised.

spine:
  org:        {types: [organizations.organization], scope: global}
  account:    {types: [account],                    scope: global}
  region:     {types: [region],                     scope: regional}
  network:    {types: [ec2.vpc, vpc],               scope: regional}
  zone:       {types: [az],                         scope: zonal}
  segment:    {types: [ec2.subnet, subnet],         scope: zonal}


# ══════════════════════════════════════════════════════════════════════
# DISCRIMINATORS — placement decided by the resource's own data
# ══════════════════════════════════════════════════════════════════════

discriminators:

  ec2.vpc_endpoint:
    field: VpcEndpointType
    cases:
      Gateway:   door.service   # a route-table entry. No ENI, so it is a border.
      Interface: resident.ingress       # has an ENI in a subnet, so it is a resident.
      GatewayLoadBalancer: resident.ingress
    default: resident.ingress

  elbv2.load_balancer:
    field: Scheme
    cases:
      internet-facing: resident.balancer
      internal:        resident.balancer
    default: resident.balancer
    entry_when: {Scheme: internet-facing}

  elb.load_balancer:
    field: Scheme
    cases:
      internet-facing: resident.balancer
      internal:        resident.balancer
    default: resident.balancer
    entry_when: {Scheme: internet-facing}

  lambda.function:
    field: VpcConfig.SubnetIds
    cases:
      non_empty: resident.compute       # attached to the VPC - a resident of a subnet
    default: resident.serverless             # no VpcConfig - a regional service

  ec2.instance:
    field: PublicIpAddress
    default: resident.compute
    entry_when: {PublicIpAddress: present}

  apigateway.rest_api:
    field: EndpointConfiguration.Types
    cases:
      PRIVATE: resident.ingress         # private APIs terminate on an interface endpoint
    # A public API is an ingress too. The split used to be ingress-vs-api, which
    # read as "only a private API is an entry point" - but both terminate
    # inbound traffic at the boundary, which is what L2 means. What differs is
    # WHERE they terminate, and the role's container already says that:
    # [region, segment]. A private one lands in the segment its endpoint is in,
    # a public one in the region.
    default: resident.ingress
    entry_when: {EndpointConfiguration.Types: not PRIVATE}


# ══════════════════════════════════════════════════════════════════════
# SUFFIXES — what the type name already tells us
# ══════════════════════════════════════════════════════════════════════
#
# A parameter group, a snapshot and a version hold no address and serve no
# traffic, whatever service they belong to. Falling through to the service
# default made 66 of them residents: `rds.rds_snapshot` inherited `rds ->
# resident.data` and was drawn as though it were a database, and `lambda.version`
# was drawn as though it were a function.
#
# The renderer already knew better - it labels these "configuration" and
# "snapshots" - which is the tell that the rule belongs in the data and not in
# the view. Overrides still win, so `acm.certificate` stays a platform binding
# while `rds.certificate` becomes an artifact.

suffixes:
  - {match: 'snapshot',            role: record}
  - {match: '[._]parameter_group$',   role: record}
  - {match: '[._]option_group$',      role: record}
  - {match: '[._]subnet_group$',      role: record}
  - {match: '[._]schedule_group$',    role: record}
  - {match: '\.version$',          role: record}
  - {match: 'certificate$',        role: record}
  # A target group is part of exactly one load balancer - a component, so it
  # nests inside it rather than sitting beside it as a peer.
  # A security group is a security group whichever service names it.
  - {match: '[._]security_group$',    role: rule.network}
  - {match: '[._]target_group$',      role: part}
  # A definition is a template, not a running thing. 41 types match, from
  # `ecs.task_definition` to the seven Greengrass `*_definition`s that were
  # filling `compute.edge` with seven groups of one apiece. You deploy FROM a
  # definition; the deployment is the architecture.
  - {match: '[._]definition$',        role: record}
  # Same argument, 181 types: `apprunner.auto_scaling_configuration` and
  # `autoscaling.launch_configuration` describe how something should be built.
  # Anchored, so `config.configuration_recorder` - which is a live governance
  # control - is untouched.
  - {match: '[._]configuration$',     role: record}
  # A listener belongs to exactly one load balancer, the way a target group
  # does. Drawing it as a peer of the balancer doubles the box count and says
  # the port is a separate piece of infrastructure.
  - {match: '[._]listener$',          role: part}


# ══════════════════════════════════════════════════════════════════════
# OVERRIDES — exact keys the service segment would get wrong
# ══════════════════════════════════════════════════════════════════════

overrides:

  # ── borders. These are not IN the network, they ARE its edge (C2) ──
  # A Security Hub standard is CIS, PCI DSS, NIST — a yardstick the account is
  # measured against, not a thing in the architecture. It drew 13 tabs on the
  # region's west wall because Security Hub's API returns them as objects, which
  # is a fact about the API and not about the estate.
  securityhub.standard:                      record
  ec2.internet_gateway:             door.internet
  ec2.egress_only_internet_gateway: door.internet
  ec2.vpn_gateway:                  door.onprem
  ec2.vpn_connection:               door.onprem
  directconnect.connection:         door.onprem
  directconnect.virtual_interface:  door.onprem
  ec2.vpc_peering_connection:       door.lateral
  ec2.transit_gateway_attachment:   door.lateral
  ec2.transit_gateway:              door.lateral

  # ── control planes. What runs is an instance, a task or a function, and
  #    those are drawn already; a cluster, a state machine or a training hub
  #    is the thing that DRIVES them. Drawn as residents they read as a second
  #    fleet standing beside the real one.
  ecs.cluster:                      rule.orchestration
  eks.cluster:                      rule.orchestration
  eks.fargate_profile:              rule.orchestration
  batch.job_queue:                  rule.orchestration
  stepfunctions.state_machine:      rule.orchestration
  sagemaker.hub:                    rule.orchestration
  sagemaker.domain:                 rule.orchestration
  autoscaling-plans.scaling_plan:   rule.orchestration
  # NOT here, deliberately: an autoscaling group and a capacity provider are
  # already `rule.scaling`, which is the same idea scoped to the network
  # rather than the region - and a scaling group really is per-VPC. Nor a
  # nodegroup, an EMR cluster or a Batch compute environment: those ARE the
  # instances, not the thing driving them, and they stay `resident.compute`.
  # A registry is not architecture. ECR orchestrates nothing and serves no
  # traffic - it is what an image is pulled FROM, which is provenance, and
  # provenance belongs in the panel of the thing it built. On canvas it put 16
  # repositories beside 3 instances and made the registry look bigger than the
  # fleet it feeds.
  ecr.repository:                   record
  ecr.image:                        record
  # A launch configuration and a launch template describe how to build an
  # instance. The scaling group that USES them is a real control plane and
  # stays on the network border; the recipes it reads do not.
  autoscaling.launch_configuration: record

  # ── things a service scopes to itself, which the service segment reads as
  #    workloads. An ElastiCache "user" is a Redis ACL entry scoped to a cache,
  #    not a person and not a running thing; a work group is a query policy.
  elasticache.user:                 rule.identity
  memorydb.user:                    rule.identity
  athena.work_group:                rule.governance
  ivs.playback_restriction_policy:  rule.governance
  # A stage is one deployment of one API - a component of it, not a peer.
  apigateway.stage:                 part
  apigatewayv2.stage:               part
  # `gamelift.location` is a list of region names returned as resources. It is
  # a lookup table, and drawing "ap-south-1" as a box inside ap-south-1 is the
  # kind of thing that makes a reader distrust the whole diagram.
  gamelift.location:                record

  # ── the traffic path inside a network ──
  ec2.nat_gateway:                  door.egress
  appsync.api:                      resident.api
  apigatewayv2.api:                 resident.ingress
  apprunner.service:                resident.api

  # ── zonal workloads ──
  rds.db_instance:                  resident.data
  rds.db_cluster:                   resident.data
  elasticache.cache_cluster:        resident.data
  elasticache.replication_group:    resident.data
  redshift.cluster:                 resident.data
  opensearch.domain:                resident.data
  es.elasticsearch_domain:          resident.data
  efs.mount_target:                 resident.data
  fsx.file_system:                  resident.data
  docdb.db_cluster:                 resident.data
  memorydb.cluster:                 resident.data
  neptune.db_cluster:               resident.data

  ec2.instance:                     resident.compute
  ecs.service:                      resident.compute
  eks.nodegroup:                    resident.compute
  emr.cluster:                      resident.compute
  batch.compute_environment:        resident.compute
  sagemaker.notebook_instance:      resident.compute

  # ── things bound to a workload, not to the network ──
  ec2.volume:                       part
  ec2.network_interface:            part
  ec2.eip:                          part

  # ── fleet bindings: govern workloads, own no address ──
  autoscaling.auto_scaling_group:   rule.scaling
  ecs.capacity_provider:            rule.scaling

  # ── bindings: they govern residents and hold no address (C1) ──
  ec2.security_group:               rule.network
  ec2.network_acl:                  rule.network
  ec2.route_table:                  rule.network
  ec2.prefix_list:                  rule.network
  ec2.dhcp_options:                 rule.network
  ec2.flow_log:                     rule.network

  # ── artefacts: provenance, saved settings and output ──
  # None of these governs anything. Filed as bindings they were drawn on a
  # border, which said a key pair controls the network.
  ec2.ami:                          record
  ec2.image:                        record
  ec2.ebs_snapshot:                 record
  ec2.snapshot:                     record
  ec2.key_pair:                     record
  ec2.launch_template:              record
  ec2.spot_instance_request:        record
  ec2.principal_id_format:          record
  ec2.verified_access_instance:     record
  ec2.network_insights_access_scope: record
  ec2.transit_gateway_route_table:  rule.network
  logs.log_group:                   record
  logs.log_group_field:             record
  logs.log_stream:                  record
  cloudformation.stack:             rule.governance
  appconfig.extension:              record
  appconfig.deployment_strategy:    record
  snowball.compatible_image:        record
  ssm.ssm_managed_instance:         record
  service-quotas.service_quota_request: record

  # The certificate service itself, not provenance from another one - so it
  # outranks the `certificate$` suffix that makes rds.certificate an artifact.
  acm.certificate:                  rule.platform
  acm-pca.certificate_authority:    rule.platform

  # ── global edge: upstream of every region (A1) ──
  cloudfront.distribution:          door.ingress
  # Same object, older protocol. It resolved to resident.edge through the
  # service-level fallback and drew inline while its sibling sat on the border,
  # which reads as two kinds of CDN rather than one.
  cloudfront.streaming_distribution: door.ingress
  globalaccelerator.accelerator:    resident.edge
  wafv2.web_acl:                    resident.edge
  waf.web_acl:                      resident.edge
  shield.protection:                resident.edge
  route53.hosted_zone:              door.ingress
  # ── account-wide identity (C1: applies to everything, so a rail) ──
  organizations.organization:       rule.identity
  organizations.account:            rule.identity
  sso-admin.instance:               rule.identity
  ram.resource_share:               rule.identity



# ══════════════════════════════════════════════════════════════════════
# SERVICES — the bulk default, by service segment of the resource_key
# ══════════════════════════════════════════════════════════════════════
#
# This is where the thousands of long-tail types get placed. `sqs.queue`,
# `sqs.queue_attribute` and every other `sqs.*` resolve through one row.

services:

  # ── resident.regional, category: api ──
  # Only `rest_api` and `apigatewayv2.api` are entry points; the service
  # default covers 38 config types — keys, methods, usage plans — that are
  # not on the traffic path at all. Those two are bound explicitly above.
  apigateway: resident.api
  apigatewayv2: resident.api
  appsync: resident.api
  apprunner: resident.api
  amplify: resident.api

  # ── resident.regional, category: integration ──
  sqs: resident.integration
  sns: resident.integration
  mediaconvert: resident.application
  ivs: resident.application
  ivschat: resident.application
  medialive: resident.application
  mediapackage: resident.application
  pinpoint: resident.application
  pinpoint-sms-voice-v2: resident.application
  ses: resident.application
  sesv2: resident.application
  chime: resident.application
  connect: resident.application
  events: resident.integration
  eventbridge: resident.integration
  scheduler: resident.integration
  stepfunctions: resident.integration
