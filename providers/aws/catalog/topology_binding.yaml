  mq: resident.integration
  kinesis: resident.integration
  firehose: resident.integration
  kinesisanalytics: resident.integration
  kafka: resident.integration
  pipes: resident.integration

  # ── resident.regional, category: serverless ──
  lambda: resident.serverless
  gamelift: resident.application
  batch: resident.serverless
  greengrass: resident.serverless # edge runtime definitions, no network presence
  iot: resident.application
  iotanalytics: resident.application

  # ── scaling machinery: describes compute, so it rides the compute lane ──
  autoscaling: resident.compute
  autoscaling-plans: rule.governance
  application-autoscaling: rule.governance
  service-quotas: rule.governance

  # ── resident.regional, category: api (managed app hosting) ──
  elasticbeanstalk: resident.api

  # ── resident.regional, category: containers ──
  ecs: resident.containers
  eks: resident.containers
  ecr: resident.containers
  ecr-public: resident.containers

  # ── resident.regional, category: datastore ──
  s3: resident.datastore
  s3control: resident.datastore
  s3tables: resident.datastore
  dynamodb: resident.datastore
  timestream: resident.datastore
  keyspaces: resident.datastore
  qldb: resident.datastore
  simpledb: resident.datastore
  efs: resident.datastore
  fsx: resident.datastore
  storagegateway: resident.datastore
  backup: resident.datastore

  # ── resident.regional, category: analytics ──
  athena: resident.analytics
  glue: resident.analytics
  emr: resident.analytics
  redshift: resident.analytics
  redshift-serverless: resident.analytics
  opensearch: resident.analytics
  opensearchserverless: resident.analytics
  es: resident.analytics
  quicksight: resident.analytics
  datazone: resident.analytics
  lakeformation: resident.analytics
  datapipeline: resident.analytics
  dataexchange: resident.analytics

  # ── resident.regional, category: ai ──
  sagemaker: resident.ai
  bedrock: resident.ai
  bedrock-agent: resident.ai
  comprehend: resident.ai
  textract: resident.ai
  rekognition: resident.ai
  transcribe: resident.ai
  translate: resident.ai
