# ══════════════════════════════════════════════════════════════════════
# ATTACHMENT ORDER — inside a workload box
# ══════════════════════════════════════════════════════════════════════

attachment_order:
  - {match: {type: ec2.volume, root: true},   rank: 10, label: root volume}
  - {match: {type: ec2.volume},               rank: 20, label: data volume}
  - {match: {type: ec2.network_interface, primary: true}, rank: 30, label: primary interface}
  - {match: {type: ec2.network_interface},    rank: 40, label: interface}
  - {match: {type: ec2.eip},                  rank: 50, label: elastic ip}


# ══════════════════════════════════════════════════════════════════════
# TAXONOMY — which of this cloud's services fills each slot
# ══════════════════════════════════════════════════════════════════════
#
# `category.subcategory` from the model. Independent of placement: a security
# group is a `binding` on the network's rail AND a `network.firewall` service,
# and neither fact follows from the other.
#
# Keyed by service segment, with type-level overrides where one service spans
# slots - `ec2` alone covers instances, block storage, firewall and routing,
# which is exactly the lumping that made "NETWORK 59" useless as a filter row.

taxonomy_types:
  # Logging and telemetry, kept apart in the data and rolled up to one
  # `observability` tab on the border — see `rollup` in the model.
  ec2.flow_log:                              governance.flow-logs
  vpcflowlogs.flow_log:                      governance.flow-logs
  cloudwatch.alarm:                          governance.alarms
  cloudwatch.composite_alarm:                governance.alarms
  cloudwatch.alarms_for_metric:              governance.alarms
  cloudwatch.anomaly_detector:               governance.alarms
  cloudwatch.dashboard:                      governance.metrics
  cloudwatch.insight_rule:                   governance.metrics
  cloudwatch.metric_stream:                  governance.metrics
  synthetics.canary:                         governance.synthetics
  synthetics.canary_run:                     governance.synthetics
  synthetics.group:                          governance.synthetics
  synthetics.associated_group:               governance.synthetics
  # Named individually because these are the things people look for BY NAME.
  # As one `connectivity` bucket an internet gateway, a transit gateway, a
  # Direct Connect and an ENI were indistinguishable on the border - 103
  # types under one word, and the word was the least useful one available.
  ec2.internet_gateway:                      network.igw
  ec2.egress_only_internet_gateway:          network.igw
  ec2.nat_gateway:                           network.nat
  ec2.transit_gateway:                       network.tgw
  ec2.transit_gateway_attachment:            network.tgw
  ec2.vpc_peering_connection:                network.peering
  ec2.vpn_connection:                        network.vpn
  ec2.vpn_gateway:                           network.vpn
  ec2.customer_gateway:                      network.vpn
  ec2.network_interface:                     network.interface
  ec2.security_group:                        network.security-group
  ec2.security_group_rule:                   network.security-group
  ec2.network_acl:                           network.nacl
  ec2.vpc_endpoint:                          network.private-link
  ec2.vpc_endpoint_service:                  network.private-link
  # An API gateway is a proxy, not an integration: it terminates inbound traffic
  # at the boundary exactly as a load balancer does. `network.proxy` is for
  # entry points that are NOT subnet-deployed; a balancer that is stays in
  # `network.loadbalancing`. Per TYPE, because the other 38 apigateway.* types
  # are the API's configuration and belong with integration.
  # A cache USER is a principal, not a cache. Bound to `rule.identity` and so
  # drawn on the north arm, it inherited `database.cache` from its service and
  # put a tab reading `CACHE 2` beside `IDENTITY 191` — which says "two caches"
  # about two login accounts. The role was right; the domain was the service's.
  elasticache.user:        security.identity
  elasticache.user_group:  security.identity
  memorydb.user:           security.identity
  # A permission document is not a principal. `iam` as a service binds to
  # security.identity, which swept roles, groups, instance profiles AND every
  # policy into one tab — so the map could say how many IAM objects exist and
  # not which of them can act. Per TYPE, because the same service legitimately
  # supplies both halves.
  #
  # Inline policies (`user_policy`, `role_policy`, `group_policy`) are named
  # alongside the managed ones: a permission granted inline is still a
  # permission, and filing it with the principal is what hid it.
  iam.policy:                    security.policy
  iam.policy_version:            security.policy
  iam.attached_role_policy:      security.policy
  iam.attached_user_policy:      security.policy
  iam.attached_group_policy:     security.policy
  iam.role_policy:               security.policy
  iam.user_policy:               security.policy
  iam.group_policy:              security.policy
  iam.permissions_boundary:      security.policy
  iam.service_linked_role_policy: security.policy
  apigateway.rest_api:     network.proxy
  apigatewayv2.api:        network.proxy
  ec2.instance:            compute.instances
  ec2.spot_instance_request: compute.instances
  ec2.volume:              storage.block
  ec2.ebs_snapshot:        storage.backup
  ec2.ami:                 compute.instances
  ec2.image:               compute.instances
  ec2.key_pair:            security.identity
  ec2.launch_template:     compute.instances
  ec2.eip:                 network.connectivity
  # Every other door is network.connectivity; this one inherited the ec2
  # service default and was filed as compute.instances. It DRAWS — a door sits
  # on the container border — so the domain was visible in the filter panel and
  # in its own tab. The sibling test keys on name EXTENSION, and
  # `egress_only_internet_gateway` prefixes rather than extends
  # `internet_gateway`, so nothing caught it.
  ec2.route_table:         network.routing
  ec2.prefix_list:         network.routing
  ec2.transit_gateway_route_table: network.routing
  ec2.dhcp_options:        network.routing
  ec2.vpc:                 network.connectivity
  ec2.subnet:              network.connectivity
  ec2.network_insights_access_scope: network.firewall
  ec2.verified_access_instance: security.identity
  rds.db_security_group:   network.firewall
  # A registry stores the images a container is built from. That is supply, not
  # compute - and filing 16 repositories under compute.containers made a fleet
  # of one ECS cluster look like a fleet of seventeen.
  ecr.repository:          devops.artifact

  # Types that extend another type's name and must not disagree with it. Every
  # one of these fell through to the `ec2` or `ecr` service default: a firewall
  # rule filed under compute, a VPC endpoint association filed under compute.
  # Surfaced by scripts/aws-grid.py, which compares a type against the longest
  # explicitly-classified type its name extends.
  ec2.security_group_vpc_association: network.firewall
  ec2.transit_gateway_connect:              network.connectivity
  ec2.transit_gateway_connect_peer:         network.connectivity
  ec2.transit_gateway_multicast_domain:     network.connectivity
  ec2.transit_gateway_peering_attachment:   network.connectivity
  ec2.transit_gateway_policy_table:         network.connectivity
  ec2.transit_gateway_vpc_attachment:       network.connectivity
  ec2.vpc_block_public_access_exclusion:    network.connectivity
  ec2.vpc_block_public_access_options:      network.connectivity
  ec2.vpc_endpoint_association:             network.private-link
  ec2.vpc_endpoint_connection:              network.private-link
  ec2.vpc_endpoint_connection_notification: network.private-link
  ecr.repository_creation_template:         devops.artifact
  ecr.repository_policy:                    devops.artifact

  # Load balancing, split out of `delivery` so a CDN and an ALB stop sharing a
  # filter row. Listeners and target groups follow their balancer.
  elbv2.load_balancer:     network.loadbalancing
  elbv2.listener:          network.loadbalancing
  elbv2.listener_certificate: network.loadbalancing
  elbv2.rule:              network.loadbalancing
  elbv2.target_group:      network.loadbalancing
  elbv2.target_health:     network.loadbalancing
  elbv2.ssl_policy:        network.loadbalancing
  elbv2.trust_store:       network.loadbalancing
  elb.load_balancer:       network.loadbalancing
  elb.load_balancer_policy: network.loadbalancing

