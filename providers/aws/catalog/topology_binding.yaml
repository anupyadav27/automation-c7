  trustedadvisor: rule.governance
  health: rule.governance
  support: rule.governance

  # ── network plumbing that is neither border nor resident ──
  # The genuine network bindings are named explicitly above; anything else
  # carrying an `ec2.` prefix is configuration or provenance, so the fallback
  # is governance rather than the VPC rail.
  ec2: record
  networkmanager: rule.network
  globalaccelerator: resident.edge
  cloudfront: resident.edge
  route53: resident.edge
  route53resolver: rule.network
  route53domains: resident.edge
  directconnect: door.onprem
  elb: resident.balancer
  elbv2: resident.balancer
  vpc-lattice: resident.balancer


# ══════════════════════════════════════════════════════════════════════
# CLUSTERS — which AWS facts prove an ownership claim
# ══════════════════════════════════════════════════════════════════════
#
# Precedence is the model's (cluster_precedence). This file only supplies the
