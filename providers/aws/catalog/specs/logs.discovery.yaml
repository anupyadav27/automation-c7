- discovery_id: aws.logs.get_log_events
  for_each: aws.logs.describe_log_streams
  calls:
  - action: get_log_events
    params:
      logStreamName: '{{ item.logStreamName }}'
    save_as: response
    on_error: continue
  emit:
    as: item
    items_for: '{{ response.events }}'
    item:
      ingestionTime: '{{ item.ingestionTime }}'
      message: '{{ item.message }}'
      timestamp: '{{ item.timestamp }}'
      nextBackwardToken: '{{ response.nextBackwardToken }}'
      nextForwardToken: '{{ response.nextForwardToken }}'
