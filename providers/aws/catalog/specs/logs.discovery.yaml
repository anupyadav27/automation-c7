    item:
      executionRoleArn: '{{ item.executionRoleArn }}'
- discovery_id: aws.logs.get_scheduled_query_history
  calls:
  - action: get_scheduled_query_history
    save_as: response
    on_error: continue
  emit:
    as: item
    items_for: '{{ response.triggerHistory }}'
    item:
