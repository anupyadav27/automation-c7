- discovery_id: aws.logs.get_delivery_destination_policy
  for_each: aws.logs.describe_delivery_destinations
  calls:
  - action: get_delivery_destination_policy
    params:
      deliveryDestinationName: '{{ item.deliveryDestinationName }}'
    save_as: response
    on_error: continue
  emit:
    as: item
    item:
      deliveryDestinationPolicy: '{{ response.policy.deliveryDestinationPolicy }}'
      policy: '{{ response.policy.policy }}'
- discovery_id: aws.logs.get_delivery_source
  for_each: aws.logs.describe_delivery_destinations
  calls:
  - action: get_delivery_source
    params:
      name: '{{ item.name }}'
    save_as: response
    on_error: continue
  emit:
