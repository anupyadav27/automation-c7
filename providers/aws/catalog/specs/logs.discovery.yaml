    item:
      arn: '{{ response.deliverySource.arn }}'
      deliverySource: '{{ response.deliverySource.deliverySource }}'
      logType: '{{ response.deliverySource.logType }}'
      name: '{{ response.deliverySource.name }}'
      resourceArns: '{{ response.deliverySource.resourceArns }}'
      service: '{{ response.deliverySource.service }}'
      tags: '{{ response.deliverySource.tags }}'
- discovery_id: aws.logs.get_integration
  for_each: aws.logs.list_integrations
  calls:
  - action: get_integration
    params:
      integrationName: '{{ item.integrationName }}'
    save_as: response
    on_error: continue
  emit:
    as: item
    item:
      integrationDetails: '{{ response.integrationDetails.integrationDetails }}'
      openSearchIntegrationDetails: '{{ response.integrationDetails.openSearchIntegrationDetails }}'
      policyName: '{{ response.integrationDetails.openSearchIntegrationDetails.accessPolicy.policyName }}'
      status: '{{ response.integrationDetails.openSearchIntegrationDetails.accessPolicy.status.status }}'
      statusMessage: '{{ response.integrationDetails.openSearchIntegrationDetails.accessPolicy.status.statusMessage }}'
      applicationArn: '{{ response.integrationDetails.openSearchIntegrationDetails.application.applicationArn }}'
      applicationEndpoint: '{{ response.integrationDetails.openSearchIntegrationDetails.application.applicationEndpoint }}'
      applicationId: '{{ response.integrationDetails.openSearchIntegrationDetails.application.applicationId }}'
      collectionArn: '{{ response.integrationDetails.openSearchIntegrationDetails.collection.collectionArn }}'
      collectionEndpoint: '{{ response.integrationDetails.openSearchIntegrationDetails.collection.collectionEndpoint }}'
      dataSourceName: '{{ response.integrationDetails.openSearchIntegrationDetails.dataSource.dataSourceName }}'
      workspaceId: '{{ response.integrationDetails.openSearchIntegrationDetails.workspace.workspaceId }}'
      integrationName: '{{ response.integrationName }}'
      integrationStatus: '{{ response.integrationStatus }}'
      integrationType: '{{ response.integrationType }}'
- discovery_id: aws.logs.get_log_anomaly_detector
  for_each: aws.logs.list_anomalies
  calls:
  - action: get_log_anomaly_detector
    params:
      anomalyDetectorArn: '{{ item.anomalyDetectorArn }}'
    save_as: response
    on_error: continue
  emit:
    as: item
    items_for: '{{ response.logGroupArnList }}'
    item:
      anomalyDetectorStatus: '{{ response.anomalyDetectorStatus }}'
      anomalyVisibilityTime: '{{ response.anomalyVisibilityTime }}'
      creationTimeStamp: '{{ response.creationTimeStamp }}'
