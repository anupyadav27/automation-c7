      parseCloudfront: '{{ item.parseCloudfront }}'
      parseJSON: '{{ item.parseJSON }}'
      parseKeyValue: '{{ item.parseKeyValue }}'
      parsePostgres: '{{ item.parsePostgres }}'
      parseRoute53: '{{ item.parseRoute53 }}'
      parseToOCSF: '{{ item.parseToOCSF }}'
      parseVPC: '{{ item.parseVPC }}'
      parseWAF: '{{ item.parseWAF }}'
      renameKeys: '{{ item.renameKeys }}'
      splitString: '{{ item.splitString }}'
      substituteString: '{{ item.substituteString }}'
      trimString: '{{ item.trimString }}'
