      arn: '{{ response.deliveryDestination.arn }}'
      deliveryDestinationConfiguration: '{{ response.deliveryDestination.deliveryDestinationConfiguration }}'
      deliveryDestinationType: '{{ response.deliveryDestination.deliveryDestinationType }}'
      name: '{{ response.deliveryDestination.name }}'
      outputFormat: '{{ response.deliveryDestination.outputFormat }}'
      tags: '{{ response.deliveryDestination.tags }}'
