      ResourceType: '{{ item.ResourceType }}'
      SourceBackupVaultArn: '{{ item.SourceBackupVaultArn }}'
      SourceRecoveryPointArn: '{{ item.SourceRecoveryPointArn }}'
      State: '{{ item.State }}'
