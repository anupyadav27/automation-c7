policies:

  # ---------------------------------------------------------------
  # RDS snapshots without encryption
  # ---------------------------------------------------------------
  - name: rds-snapshot-unencrypted
    resource: rds-snapshot
    description: >
      RDS snapshots (manual and automated) that are not encrypted.
      Unencrypted snapshots are a compliance risk — snapshot data
      should be protected at rest.
    filters:
      - type: value
        key: Encrypted
        value: false
      - type: value
        key: SnapshotType
        op: in
        value:
          - manual
          - automated
    actions:
      - type: tag
        key: c7n:security
        value: "unencrypted-rds-snapshot"
      - type: notify
        template: default.html
        subject: "[c7n] SECURITY: Unencrypted RDS snapshot found"
        to:
          - your-team@example.com
        transport:
          type: sqs
          queue: https://sqs.{region}.amazonaws.com/{account_id}/c7n-notifications

  # ---------------------------------------------------------------
  # RDS instances with auto minor version upgrade disabled
  # ---------------------------------------------------------------
  - name: rds-no-auto-minor-upgrade
    resource: rds
    description: >
      RDS instances with automatic minor version upgrades disabled.
      Minor upgrades include security patches. Not upgrading leaves
      instances exposed to known vulnerabilities.
    filters:
      - type: value
        key: AutoMinorVersionUpgrade
        value: false
    actions:
      - type: tag
        key: c7n:security
        value: "auto-minor-upgrade-disabled"
      - type: notify
        template: default.html
        subject: "[c7n] RDS auto minor version upgrade disabled — security patches blocked"
        to:
          - your-team@example.com
        transport:
          type: sqs
          queue: https://sqs.{region}.amazonaws.com/{account_id}/c7n-notifications
