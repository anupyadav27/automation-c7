policies:

  # ---------------------------------------------------------------
  # 1. Secrets not rotated in 90+ days
  # ---------------------------------------------------------------
  - name: secret-not-rotated
    resource: secrets-manager
    description: >
      Secrets Manager secrets whose LastRotatedDate is more than
      90 days ago (or never rotated). Long-lived secrets increase
      the blast radius of a credential compromise.
    filters:
      - or:
          - type: value
            key: LastRotatedDate
            value: absent
          - type: value
            key: LastRotatedDate
            value: 90
            op: greater-than
    actions:
      - type: tag
        key: c7n:security
        value: "secret-not-rotated-90d"
      - type: notify
        template: default.html
        subject: "[c7n] Secret not rotated in 90+ days — rotation required"
        to:
          - your-team@example.com
        transport:
          type: sqs
          queue: https://sqs.{region}.amazonaws.com/{account_id}/c7n-notifications

  # ---------------------------------------------------------------
  # 2. Secrets with automatic rotation disabled
  # ---------------------------------------------------------------
  - name: secret-rotation-disabled
    resource: secrets-manager
    description: >
      Secrets Manager secrets without automatic rotation configured.
      Manual rotation is error-prone and often skipped. Automate
      rotation for all long-lived secrets.
    filters:
      - type: value
        key: RotationEnabled
        value: false
    actions:
      - type: tag
        key: c7n:security
        value: "secret-rotation-disabled"
      - type: notify
        template: default.html
        subject: "[c7n] Secret rotation disabled — configure automatic rotation"
        to:
          - your-team@example.com
        transport:
          type: sqs
          queue: https://sqs.{region}.amazonaws.com/{account_id}/c7n-notifications

  # ---------------------------------------------------------------
  # 3. Secrets missing required tags
  # ---------------------------------------------------------------
  - name: secret-missing-tags
    resource: secrets-manager
    description: >
      Secrets Manager secrets missing Owner or Environment tags.
      Untagged secrets cannot be attributed to a team and are
      excluded from cost allocation reports.
    filters:
      - or:
          - "tag:Owner": absent
          - "tag:Environment": absent
    actions:
      - type: tag
        key: c7n:compliance
        value: "missing-required-tags"
      - type: notify
        template: default.html
        subject: "[c7n] Secret missing Owner or Environment tag — add for ownership tracking"
        to:
          - your-team@example.com
        transport:
          type: sqs
          queue: https://sqs.{region}.amazonaws.com/{account_id}/c7n-notifications
