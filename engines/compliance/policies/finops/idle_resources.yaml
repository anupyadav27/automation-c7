policies:

  # ---------------------------------------------------------------
  # RDS instances with zero database connections for 14 days
  # ---------------------------------------------------------------
  - name: rds-idle-instance
    resource: rds
    description: >
      RDS instances with no database connections (DatabaseConnections = 0)
      over the past 14 days. These are idle and incurring full instance
      cost. Candidate for stopping or deletion.
    filters:
      - type: metrics
        name: DatabaseConnections
        namespace: AWS/RDS
        statistics: Maximum
        days: 14
        value: 1
        op: less-than
      - type: value
        key: DBInstanceStatus
        value: available
    actions:
      - type: tag
        key: c7n:recommendation
        value: "rds-idle-review-or-stop"
      - type: notify
        template: default.html
        subject: "[c7n] RDS instance has 0 connections for 14 days — review or stop"
        to:
          - your-team@example.com
        transport:
          type: sqs
          queue: https://sqs.{region}.amazonaws.com/{account_id}/c7n-notifications

  # ---------------------------------------------------------------
  # RDS instances stopped for more than 7 days
  # ---------------------------------------------------------------
  - name: rds-stopped-7d
    resource: rds
    description: >
      RDS instances in stopped state for more than 7 days. AWS
      automatically restarts stopped instances after 7 days, which
      resumes billing. Review for termination if no longer needed.
    filters:
      - type: value
        key: DBInstanceStatus
        value: stopped
    actions:
      - type: tag
        key: c7n:recommendation
        value: "rds-stopped-review-for-deletion"
      - type: notify
        template: default.html
        subject: "[c7n] RDS instance stopped — AWS will auto-restart in 7 days"
        to:
          - your-team@example.com
        transport:
          type: sqs
          queue: https://sqs.{region}.amazonaws.com/{account_id}/c7n-notifications
