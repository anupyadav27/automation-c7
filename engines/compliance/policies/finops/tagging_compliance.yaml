policies:

  # ---------------------------------------------------------------
  # Lambda functions missing required cost-allocation tags
  # ---------------------------------------------------------------
  - name: lambda-missing-tags
    resource: lambda
    description: >
      Lambda functions missing Owner, Environment, or Project tags.
      Untagged functions cannot be attributed in cost reports or budgets.
    filters:
      - or:
          - "tag:Owner": absent
          - "tag:Environment": absent
          - "tag:Project": absent
    actions:
      - type: tag
        key: c7n:compliance
        value: "missing-required-tags"
      - type: notify
        template: default.html
        subject: "[c7n] Lambda function missing required tags — add Owner/Environment/Project"
        to:
          - your-team@example.com
        transport:
          type: sqs
          queue: https://sqs.{region}.amazonaws.com/{account_id}/c7n-notifications

  # ---------------------------------------------------------------
  # RDS instances missing required cost-allocation tags
  # ---------------------------------------------------------------
  - name: rds-missing-tags
    resource: rds
    description: >
      RDS instances missing Owner, Environment, or Project tags.
      Untagged databases skew cost allocation and make it impossible
      to chargeback to the correct team.
    filters:
      - or:
          - "tag:Owner": absent
          - "tag:Environment": absent
          - "tag:Project": absent
    actions:
      - type: tag
        key: c7n:compliance
        value: "missing-required-tags"
      - type: notify
        template: default.html
        subject: "[c7n] RDS instance missing required tags — add Owner/Environment/Project"
        to:
          - your-team@example.com
        transport:
          type: sqs
          queue: https://sqs.{region}.amazonaws.com/{account_id}/c7n-notifications
