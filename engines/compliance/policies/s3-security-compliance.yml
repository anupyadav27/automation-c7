policies:

  # ---------------------------------------------------------------
  # 1. S3 buckets with public access enabled
  # ---------------------------------------------------------------
  - name: s3-public-access-check
    resource: s3
    description: >
      Detect S3 buckets that have public access enabled.
      Public buckets are a top security risk and should
      be blocked unless explicitly required.
    filters:
      - type: check-public-block
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
    actions:
      - type: tag
        key: c7n:alert
        value: "public-access-enabled"
      - type: notify
        template: default.html
        subject: "[c7n] ALERT: S3 bucket has public access enabled"
        to:
          - your-team@example.com
        transport:
          type: sqs
          queue: https://sqs.{region}.amazonaws.com/{account_id}/c7n-notifications

  # ---------------------------------------------------------------
  # 2. S3 buckets without encryption at rest
  # ---------------------------------------------------------------
  - name: s3-no-encryption
    resource: s3
    description: >
      Find S3 buckets without default server-side encryption.
      All buckets should have AES-256 or KMS encryption.
    filters:
      - type: bucket-encryption
        state: false
    actions:
      - type: set-bucket-encryption
        crypto: AES256
      - type: tag
        key: c7n:action
        value: "encryption-enabled-by-c7n"
      - type: notify
        template: default.html
        subject: "[c7n] S3 bucket was missing encryption – auto-enabled AES-256"
        to:
          - your-team@example.com
        transport:
          type: sqs
          queue: https://sqs.{region}.amazonaws.com/{account_id}/c7n-notifications

  # ---------------------------------------------------------------
  # 3. S3 buckets without versioning
  # ---------------------------------------------------------------
  - name: s3-no-versioning
    resource: s3
    description: >
      Buckets without versioning enabled are at risk of
      accidental data loss. Tag for review.
    filters:
      - type: value
        key: "Versioning.Status"
        value: Suspended
        op: eq
    actions:
      - type: tag
        key: c7n:recommendation
        value: "enable-versioning"
      - type: notify
        template: default.html
        subject: "[c7n] S3 bucket without versioning – enable to prevent data loss"
        to:
          - your-team@example.com
        transport:
          type: sqs
          queue: https://sqs.{region}.amazonaws.com/{account_id}/c7n-notifications

  # ---------------------------------------------------------------
  # 4. S3 buckets without access logging
  # ---------------------------------------------------------------
  - name: s3-no-access-logging
    resource: s3
    description: >
      Buckets without server access logging enabled.
      Access logs are essential for audit and security
      investigation.
    filters:
      - type: bucket-logging
        op: disabled
    actions:
      - type: tag
        key: c7n:recommendation
        value: "enable-access-logging"
      - type: notify
        template: default.html
        subject: "[c7n] S3 bucket missing access logging – enable for audit trail"
        to:
          - your-team@example.com
        transport:
          type: sqs
          queue: https://sqs.{region}.amazonaws.com/{account_id}/c7n-notifications

  # ---------------------------------------------------------------
  # 5. S3 buckets without MFA delete protection
  # ---------------------------------------------------------------
  - name: s3-no-mfa-delete
    resource: s3
    description: >
      Buckets with versioning enabled but without MFA
      delete protection. Critical buckets should require
      MFA to delete objects.
    filters:
      - type: value
        key: Versioning.Status
        value: Enabled
      - type: value
        key: Versioning.MFADelete
        value: Disabled
    actions:
      - type: tag
        key: c7n:recommendation
        value: "enable-mfa-delete"
      - type: notify
        template: default.html
        subject: "[c7n] S3 bucket versioned but missing MFA delete protection"
        to:
          - your-team@example.com
        transport:
          type: sqs
          queue: https://sqs.{region}.amazonaws.com/{account_id}/c7n-notifications

  # ---------------------------------------------------------------
  # 6. S3 buckets allowing non-SSL (HTTP) access
  # ---------------------------------------------------------------
  - name: s3-no-ssl-enforcement
    resource: s3
    description: >
      Buckets that do not enforce SSL/TLS for data in
      transit. All bucket policies should deny HTTP access.
    filters:
      - not:
          - type: has-statement
            statements:
              - Effect: Deny
                Action: "s3:*"
                Condition:
                  Bool:
                    "aws:SecureTransport": "false"
    actions:
      - type: tag
        key: c7n:recommendation
        value: "enforce-ssl-only-access"
      - type: notify
        template: default.html
        subject: "[c7n] S3 bucket allows non-SSL access – add deny HTTP policy"
        to:
          - your-team@example.com
        transport:
          type: sqs
          queue: https://sqs.{region}.amazonaws.com/{account_id}/c7n-notifications

  # ---------------------------------------------------------------
  # 7. S3 buckets with overly permissive bucket policies
  # ---------------------------------------------------------------
  - name: s3-overly-permissive-policy
    resource: s3
    description: >
      Buckets with policies that grant access to all
      AWS principals ("*"). These are effectively public
      or cross-account open.
    filters:
      - type: has-statement
        statements:
          - Effect: Allow
            Principal: "*"
    actions:
      - type: tag
        key: c7n:alert
        value: "overly-permissive-bucket-policy"
      - type: notify
        template: default.html
        subject: "[c7n] ALERT: S3 bucket policy grants access to Principal '*'"
        to:
          - your-team@example.com
        transport:
          type: sqs
          queue: https://sqs.{region}.amazonaws.com/{account_id}/c7n-notifications

  # ---------------------------------------------------------------
  # 8. Empty S3 buckets (no objects, wasting namespace)
  # ---------------------------------------------------------------
  - name: s3-empty-buckets
    resource: s3
    description: >
      Buckets with zero objects. These may be leftover
      from old projects and waste namespace/config.
    filters:
      - type: metrics
        name: NumberOfObjects
        namespace: AWS/S3
        dimensions:
          StorageType: AllStorageTypes
        statistics: Average
        days: 7
        value: 0
        op: equal
    actions:
      - type: tag
        key: c7n:recommendation
        value: "empty-bucket-consider-deletion"
      - type: notify
        template: default.html
        subject: "[c7n] Empty S3 bucket detected – consider deleting"
        to:
          - your-team@example.com
        transport:
          type: sqs
          queue: https://sqs.{region}.amazonaws.com/{account_id}/c7n-notifications

  # ---------------------------------------------------------------
  # 9. S3 buckets without any tags (governance gap)
  # ---------------------------------------------------------------
  - name: s3-untagged-buckets
    resource: s3
    description: >
      Buckets without any tags. Tags are needed for
      cost allocation, ownership tracking, and governance.
    filters:
      - "tag:Owner": absent
      - "tag:Environment": absent
      - "tag:Project": absent
    actions:
      - type: tag
        key: c7n:recommendation
        value: "add-required-tags"
      - type: notify
        template: default.html
        subject: "[c7n] S3 bucket missing required tags (Owner, Environment, Project)"
        to:
          - your-team@example.com
        transport:
          type: sqs
          queue: https://sqs.{region}.amazonaws.com/{account_id}/c7n-notifications

  # ---------------------------------------------------------------
  # 10. S3 buckets with cross-region replication but no lifecycle
  # ---------------------------------------------------------------
  - name: s3-replication-no-lifecycle
    resource: s3
    description: >
      Buckets with cross-region replication enabled but
      no lifecycle policy on the destination. Replicated
      data accumulates without cleanup.
    filters:
      - type: value
        key: Replication.ReplicationConfiguration.Rules
        value: not-null
      - not:
          - type: value
            key: "Lifecycle"
            value: not-null
    actions:
      - type: tag
        key: c7n:recommendation
        value: "replicated-bucket-add-lifecycle"
      - type: notify
        template: default.html
        subject: "[c7n] S3 bucket has replication but no lifecycle – data will accumulate"
        to:
          - your-team@example.com
        transport:
          type: sqs
          queue: https://sqs.{region}.amazonaws.com/{account_id}/c7n-notifications
