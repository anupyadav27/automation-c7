policies:

  # ---------------------------------------------------------------
  # 1. IAM users with access keys not rotated in 90 days
  # ---------------------------------------------------------------
  - name: iam-unused-access-key
    resource: iam-user
    description: >
      IAM users with access keys older than 90 days that have not
      been rotated. Long-lived access keys are a primary vector for
      credential compromise. CIS AWS Benchmark 1.14 requires 90-day rotation.
    filters:
      - type: credential
        key: access_keys.active
        value: true
      - type: credential
        key: access_keys.last_rotated
        value: 90
        op: greater-than
    actions:
      - type: tag
        key: c7n:security
        value: "access-key-not-rotated-90d"
      - type: notify
        template: default.html
        subject: "[c7n] IAM access key not rotated in 90+ days — rotate immediately"
        to:
          - your-team@example.com
        transport:
          type: sqs
          queue: https://sqs.{region}.amazonaws.com/{account_id}/c7n-notifications

  # ---------------------------------------------------------------
  # 2. IAM managed policies with overly broad permissions
  # ---------------------------------------------------------------
  - name: iam-overly-broad-policy
    resource: iam-policy
    description: >
      Customer-managed IAM policies that contain Action: '*' or
      Resource: '*'. Wildcard actions/resources violate least-privilege
      and are a critical security finding.
    filters:
      - type: has-allow-all
    actions:
      - type: tag
        key: c7n:security
        value: "overly-broad-iam-policy"
      - type: notify
        template: default.html
        subject: "[c7n] CRITICAL: IAM policy contains wildcard Action or Resource"
        to:
          - your-team@example.com
        transport:
          type: sqs
          queue: https://sqs.{region}.amazonaws.com/{account_id}/c7n-notifications

  # ---------------------------------------------------------------
  # 3. IAM roles unused for 90+ days
  # ---------------------------------------------------------------
  - name: iam-unused-role
    resource: iam-role
    description: >
      IAM roles that have not been used (no LastUsedDate) in over
      90 days. Unused roles represent dormant blast radius — any
      compromise of the associated principals inherits full permissions.
    filters:
      - type: usage
        match-operator: all
        LastAuthenticated:
          type: date
          value: 90
          op: greater-than
    actions:
      - type: tag
        key: c7n:security
        value: "iam-role-unused-90d"
      - type: notify
        template: default.html
        subject: "[c7n] IAM role unused for 90+ days — review for deletion"
        to:
          - your-team@example.com
        transport:
          type: sqs
          queue: https://sqs.{region}.amazonaws.com/{account_id}/c7n-notifications

  # ---------------------------------------------------------------
  # 4. IAM users with direct policy attachments (not via groups)
  # ---------------------------------------------------------------
  - name: iam-user-inline-policy
    resource: iam-user
    description: >
      IAM users with policies attached directly (inline or managed),
      rather than through IAM groups. Direct attachments are hard
      to audit and scale. CIS Benchmark 1.16.
    filters:
      - type: has-inline-policy
    actions:
      - type: tag
        key: c7n:security
        value: "iam-user-has-inline-policy"
      - type: notify
        template: default.html
        subject: "[c7n] IAM user has inline/direct policy — manage via groups instead"
        to:
          - your-team@example.com
        transport:
          type: sqs
          queue: https://sqs.{region}.amazonaws.com/{account_id}/c7n-notifications
