name: Idle Resource Detection
version: "1.0"
type: finops
provider: aws
resource_type: ebs_volume
description: Find idle or unattached EBS volumes wasting money
tags: [cost, ebs, idle]
rules:
  - id: FINOPS-EBS-001
    description: EBS volume is not attached to any instance
    severity: medium
    conditions:
      - field: attachments
        operator: eq
        value: 0
    remediation: Delete unattached EBS volumes or create a snapshot and delete

  - id: FINOPS-EBS-002
    description: EBS volume using expensive io1/io2 type
    severity: low
    conditions:
      - field: volume_type
        operator: in
        value: [io1, io2]
    remediation: Evaluate if gp3 would meet performance needs at lower cost
