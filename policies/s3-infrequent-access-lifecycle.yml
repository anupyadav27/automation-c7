policies:

  # ---------------------------------------------------------------
  # 1. S3 buckets without any lifecycle policy
  # ---------------------------------------------------------------
  - name: s3-missing-lifecycle
    resource: s3
    description: >
      S3 buckets that have no lifecycle configuration.
      These buckets should have lifecycle rules to
      transition or expire objects for cost savings.
    filters:
      - type: value
        key: "Lifecycle"
        value: absent
    actions:
      - type: tag
        key: c7n:recommendation
        value: "add-lifecycle-policy"
      - type: notify
        template: default.html
        subject: "[c7n] S3 bucket missing lifecycle policy"
        to:
          - your-team@example.com
        transport:
          type: sqs
          queue: https://sqs.{region}.amazonaws.com/{account_id}/c7n-notifications

  # ---------------------------------------------------------------
  # 2. S3 buckets with low GET request activity (< 100 in 14d)
  # ---------------------------------------------------------------
  - name: s3-low-access-suggest-lifecycle
    resource: s3
    description: >
      S3 buckets with fewer than 100 GET requests in the
      past 14 days. Candidates for IA or Glacier.
    filters:
      - type: metrics
        name: GetRequests
        namespace: AWS/S3
        statistics: Sum
        days: 14
        value: 100
        op: less-than
    actions:
      - type: tag
        key: c7n:recommendation
        value: "low-access-add-lifecycle"

  # ---------------------------------------------------------------
  # 3. Large buckets (> 50 GB) with low access
  # ---------------------------------------------------------------
  - name: s3-large-bucket-low-access
    resource: s3
    description: >
      Buckets over 50 GB with fewer than 500 GET requests
      in the past 14 days. High cost, low utilisation.
    filters:
      - type: metrics
        name: BucketSizeBytes
        namespace: AWS/S3
        dimensions:
          StorageType: StandardStorage
        statistics: Average
        days: 1
        value: 53687091200
        op: greater-than
      - type: metrics
        name: GetRequests
        namespace: AWS/S3
        statistics: Sum
        days: 14
        value: 500
        op: less-than
    actions:
      - type: tag
        key: c7n:recommendation
        value: "large-bucket-low-access"
