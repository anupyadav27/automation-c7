policies:

  # ---------------------------------------------------------------
  # Lambda function URLs with no authentication
  # ---------------------------------------------------------------
  - name: lambda-public-url-no-auth
    resource: lambda
    description: >
      Lambda functions with a public function URL configured with
      AuthType set to NONE. Anyone on the internet can invoke these
      functions without any authentication.
    filters:
      - type: url-config
        key: AuthType
        value: NONE
    actions:
      - type: tag
        key: c7n:security
        value: "public-url-no-auth"
      - type: notify
        template: default.html
        subject: "[c7n] CRITICAL: Lambda function URL is public with no authentication"
        to:
          - your-team@example.com
        transport:
          type: sqs
          queue: https://sqs.{region}.amazonaws.com/{account_id}/c7n-notifications

  # ---------------------------------------------------------------
  # Lambda functions with resource-based policy allowing public invoke
  # ---------------------------------------------------------------
  - name: lambda-public-invoke-policy
    resource: lambda
    description: >
      Lambda functions whose resource-based policy allows invocation
      from Principal '*' or from all AWS accounts. This grants
      unauthenticated or cross-account invoke access.
    filters:
      - type: cross-account
        whitelist_from:
          expr: accounts
          url: s3://your-config-bucket/allowed-accounts.json
    actions:
      - type: tag
        key: c7n:security
        value: "cross-account-invoke-review"
      - type: notify
        template: default.html
        subject: "[c7n] Lambda has cross-account or public invoke policy — review"
        to:
          - your-team@example.com
        transport:
          type: sqs
          queue: https://sqs.{region}.amazonaws.com/{account_id}/c7n-notifications
