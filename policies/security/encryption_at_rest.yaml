name: Encryption at Rest
version: "1.0"
type: security
provider: aws
resource_type: s3_bucket
description: Ensure data is encrypted at rest
tags: [security, encryption, s3]
rules:
  - id: SEC-ENC-001
    description: S3 bucket does not have encryption enabled
    severity: high
    conditions:
      - field: encryption_enabled
        operator: eq
        value: false
    remediation: Enable default encryption (SSE-S3 or SSE-KMS) on the bucket

  - id: SEC-ENC-002
    description: S3 bucket versioning is not enabled
    severity: medium
    conditions:
      - field: versioning_enabled
        operator: eq
        value: false
    remediation: Enable versioning to protect against accidental deletion
